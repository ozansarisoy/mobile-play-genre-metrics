[project]
name = "mpgm-mobile-play-genre-metrics"
version = "1.3.0"
description = "MPGM — Mobile Play Genre Metrics: a data-science dashboard analyzing and forecasting mobile game genre performance on Google Play, with live daily monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eddy (Ozan Yasar Sarisoy)" }]
dependencies = [
    "streamlit>=1.32",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "plotly>=5.18",
    "google-play-scraper>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["app", "analysis", "data_pipeline", "i18n", "live_fetch", "live_fetch_apple", "live_fetch_wikipedia", "theme"]
